apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    cluster.x-k8s.io/provider: kubevirt
    cluster.x-k8s.io/v1beta1: v1alpha1
    cluster.x-k8s.io/v1beta2: v1alpha1
    control-plane: controller-manager
  name: mce-capk-controller-manager
  namespace: multicluster-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: kubevirt
      cluster.x-k8s.io/v1beta1: v1alpha1
      cluster.x-k8s.io/v1beta2: v1alpha1
      control-plane: controller-manager
  template:
    metadata:
      labels:
        cluster.x-k8s.io/provider: kubevirt
        cluster.x-k8s.io/v1beta1: v1alpha1
        cluster.x-k8s.io/v1beta2: v1alpha1
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --leader-elect
        - --feature-gates=MachinePool=false
        - --exclude-annotations=hypershift.openshift.io/nodePool,hypershift.openshift.io/cluster
        command:
        - /manager
        env:
        - name: NO_PROXY
          value: 127.0.0.1,localhost
        image: '{{ .Values.manager.image.url }}:{{ .Values.manager.image.tag }}'
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
        name: manager
        ports:
        - containerPort: 9440
          name: healthz
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      securityContext:
        runAsNonRoot: true
      serviceAccountName: mce-capk-manager
      terminationGracePeriodSeconds: 10
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: mce-capk-webhook-service-cert
