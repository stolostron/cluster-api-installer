apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

## condsidering resources under cluster-api-provider-azure/config/default directory to generate the CAPZ CRDs and CRs
resources:
- default/
- base/capz-pull-secret.yaml

transformers:
- base/transformer.yaml

## Patch the default CAPZ CRDs & CRs with OCP dwonstream CAPZ requirements.
patches:
  # Update secrets
  - target:
      version: v1
      kind: Secret
      name: capz-manager-bootstrap-credentials
    patch: |-
      - op: add
        path: /metadata/labels/cluster.open-cluster-management.io~1backup
        value: ""
  # Replace Deployment with default values & helm chart value
  - target:
      version: v1
      kind: Deployment
      name: capz-controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: '{{ .Values.manager.image.url  }}:{{ .Values.manager.image.tag  }}'
  - target:
      version: v1
      kind: Deployment
      name: azureserviceoperator-controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: '{{ .Values.aso.image.url  }}:{{ .Values.aso.image.tag  }}'
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --crd-management=none
      - op: remove
        path: /spec/template/spec/initContainers
  # Remove CRD delete RBAC rule - only needed by migrate-aso-crd-stored-versions
  # init container which is disabled for ACM (CRDs managed by cluster-api-installer)
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: azureserviceoperator-crd-manager-role
    patch: |-
      - op: test
        path: /rules/3/verbs/0
        value: delete
      - op: remove
        path: /rules/3
  # Set AZURE_USER_AGENT_SUFFIX to include CAPZ image tag so ARM requests
  # carry the deployed version (the kustomize replacement in config/default
  # runs before this overlay and resolves to the base image tag "main")
  - target:
      version: v1
      kind: Secret
      name: aso-controller-settings
    patch: |-
      - op: replace
        path: /stringData/AZURE_USER_AGENT_SUFFIX
        value: 'cluster-api-provider-azure/{{.Values.manager.image.tag}}'
  - target:
      version: v1
      kind: Secret
      name: aso-controller-settings
    patch: |-
      - op: replace
        path: /stringData/AZURE_USER_AGENT_SUFFIX
        value: 'cluster-api-provider-azure/{{.Values.manager.image.tag}}'
  - target:
      kind: ServiceAccount
      name: capz-manager
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
        - name: capz-manager-pull-credentials
  - target:
      kind: ServiceAccount
      name: azureserviceoperator-default
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
        - name: capz-manager-pull-credentials
