apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: capa-controller-manager
  namespace: capa-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-aws
    control-plane: capa-controller-manager
spec:
  podSelector:
    matchLabels:
      cluster.x-k8s.io/provider: infrastructure-aws
      control-plane: capa-controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - protocol: TCP
          port: 8443
    - ports:
        - protocol: TCP
          port: 9443
  # CAPA connects to management and workload API endpoints. Keep egress open
  # until those endpoint ports are explicitly inventoried.
  egress:
    - {}
