apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: azureserviceoperator-controller-manager
  namespace: capz-system
  labels:
    app.kubernetes.io/name: azure-service-operator
    control-plane: azureserviceoperator-controller-manager
spec:
  podSelector:
    matchLabels:
      control-plane: azureserviceoperator-controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - protocol: TCP
          port: 8443
    - ports:
        - protocol: TCP
          port: 9443
  # ASO calls Azure and Kubernetes APIs; keep egress open until destinations and ports are inventoried.
  egress:
    - {}
