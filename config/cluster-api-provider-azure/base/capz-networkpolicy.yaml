apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: capz-controller-manager
  namespace: capz-system
  labels:
    cluster.x-k8s.io/provider: infrastructure-azure
    control-plane: capz-controller-manager
spec:
  podSelector:
    matchLabels:
      cluster.x-k8s.io/provider: infrastructure-azure
      control-plane: capz-controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - protocol: TCP
          port: 8443
    - ports:
        - protocol: TCP
          port: 9443
  # CAPZ connects to Azure APIs and management/workload API endpoints. Keep egress open
  # until those endpoint ports are explicitly inventoried.
  egress:
    - {}
