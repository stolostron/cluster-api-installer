apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-manager
  labels:
    cluster.x-k8s.io/provider: kubevirt
    control-plane: controller-manager
spec:
  podSelector:
    matchLabels:
      cluster.x-k8s.io/provider: kubevirt
      control-plane: controller-manager
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Kubelet probes originate from the node, which OVN-K permits regardless
  # of NetworkPolicy. CAPK exposes no metrics port, so only webhook traffic
  # needs explicit ingress access.
  - ports:
    - port: 9443
      protocol: TCP
  egress:
  - {}
