apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# Compose CAPK's subdirectories directly instead of upstream config/default.
# That default adds cert-manager resources which are replaced below with the
# OpenShift service CA, so composing the source directories avoids carrying
# and deleting its Certificate and Issuer resources.
- crd/
- rbac/
- manager/
- webhook/
- base/capk-networkpolicy.yaml

namePrefix: mce-capk-

namespace: multicluster-engine

labels:
- includeSelectors: true
  pairs:
    cluster.x-k8s.io/provider: kubevirt
    cluster.x-k8s.io/v1beta1: v1alpha1
    cluster.x-k8s.io/v1beta2: v1alpha1

patches:
  - target:
      version: v1
      kind: ValidatingWebhookConfiguration
    patch: |-
      - op: add
        path: /metadata/annotations/service.beta.openshift.io~1inject-cabundle
        value: true
  - target:
      version: v1
      kind: Service
      name: webhook-service
    patch: |-
      - op: add
        path: /metadata/annotations/service.beta.openshift.io~1serving-cert-secret-name
        value: mce-capk-webhook-service-cert
  - target:
      version: v1
      kind: Deployment
      name: controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: '{{ .Values.manager.image.url }}:{{ .Values.manager.image.tag }}'
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --exclude-annotations=hypershift.openshift.io/nodePool,hypershift.openshift.io/cluster
      # CAPK applies this exclusion to both reconciliation and webhook
      # validation. Keeping the exclusion in-process avoids maintaining
      # admission matchConditions for each webhook and remains correct if
      # upstream adds another webhook.
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          containerPort: 9443
          name: webhook-server
          protocol: TCP
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes
        value:
        - name: cert
          secret:
            defaultMode: 420
            secretName: mce-capk-webhook-service-cert
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: kubevirtclusters.infrastructure.cluster.x-k8s.io
    patch: |-
      - op: replace
        path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/controlPlaneServiceTemplate
        value:
          description: |-
            ControlPlaneServiceTemplate can be used to modify service that fronts the control plane nodes to handle the
            api-server traffic (port 6443). This field is optional, by default control plane nodes will use a service
            of type ClusterIP, which will make workload cluster only accessible within the same cluster. Note, this does
            not aim to expose the entire Service spec to users, but only provides capability to modify the service metadata
            and the service type.
          properties:
            metadata:
              description: |-
                Service metadata allows to set labels, annotations and namespace for the service.
                When infraClusterSecretRef is used, ControlPlaneService take the kubeconfig namespace by default if metadata.namespace is not specified.
                This field is optional.
              nullable: true
              properties:
                annotations:
                  additionalProperties:
                    type: string
                  type: object
                labels:
                  additionalProperties:
                    type: string
                  type: object
                namespace:
                  type: string
              type: object
            spec:
              description: |-
                Service specification allows to override some fields in the service spec.
                Note, it does not aim cover all fields of the service spec.
              properties:
                type:
                  description: |-
                    Type determines how the Service is exposed. Defaults to ClusterIP. Valid
                    options are ClusterIP, NodePort, and LoadBalancer.
                    More info: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
                  type: string
              type: object
          type: object
  - target:
      version: v1
      kind: CustomResourceDefinition
      name: kubevirtclustertemplates.infrastructure.cluster.x-k8s.io
    patch: |-
      - op: replace
        path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/controlPlaneServiceTemplate
        value:
          description: |-
            ControlPlaneServiceTemplate can be used to modify service that fronts the control plane nodes to handle the
            api-server traffic (port 6443). This field is optional, by default control plane nodes will use a service
            of type ClusterIP, which will make workload cluster only accessible within the same cluster. Note, this does
            not aim to expose the entire Service spec to users, but only provides capability to modify the service metadata
            and the service type.
          properties:
            metadata:
              description: |-
                Service metadata allows to set labels, annotations and namespace for the service.
                When infraClusterSecretRef is used, ControlPlaneService take the kubeconfig namespace by default if metadata.namespace is not specified.
                This field is optional.
              nullable: true
              properties:
                annotations:
                  additionalProperties:
                    type: string
                  type: object
                labels:
                  additionalProperties:
                    type: string
                  type: object
                namespace:
                  type: string
              type: object
            spec:
              description: |-
                Service specification allows to override some fields in the service spec.
                Note, it does not aim cover all fields of the service spec.
              properties:
                type:
                  description: |-
                    Type determines how the Service is exposed. Defaults to ClusterIP. Valid
                    options are ClusterIP, NodePort, and LoadBalancer.
                    More info: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
                  type: string
              type: object
          type: object
      - op: add
        path: /spec/versions/0/schema/openAPIV3Schema/required
        value:
        - spec
      - op: remove
        path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/metadata/minProperties
